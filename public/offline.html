<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rive — Hors ligne</title>
    <style>
      body {
        margin: 0;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #16231f;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 320px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #5b6b66;
        margin: 0 0 20px;
      }
      button {
        border: none;
        border-radius: 10px;
        background: #1f5c55;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 20px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Pas de connexion</h1>
      <p>Rive a besoin d'une connexion internet pour afficher tes données. Réessaie une fois reconnecté.</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
